<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퇴근 & 육아 카운트다운</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0c0c1e 0%, #1a1a3e 50%, #2d1b4e 100%);
            font-family: 'Outfit', sans-serif;
            color: #fff;
            overflow-x: hidden;
            padding: 20px 0;
            transition: background 0.5s ease;
        }

        body.parenting-mode {
            background: linear-gradient(135deg, #1a0c1e 0%, #2d1a3e 50%, #4e1b4e 100%);
        }

        /* 배경 애니메이션 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-animation span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.05);
            animation: float 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }

        .bg-animation span:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-delay: 0s; }
        .bg-animation span:nth-child(2) { left: 20%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .bg-animation span:nth-child(3) { left: 35%; width: 60px; height: 60px; animation-delay: 4s; }
        .bg-animation span:nth-child(4) { left: 50%; width: 40px; height: 40px; animation-delay: 0s; animation-duration: 18s; }
        .bg-animation span:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .bg-animation span:nth-child(6) { left: 75%; width: 90px; height: 90px; animation-delay: 3s; }
        .bg-animation span:nth-child(7) { left: 85%; width: 50px; height: 50px; animation-delay: 7s; }
        .bg-animation span:nth-child(8) { left: 5%; width: 35px; height: 35px; animation-delay: 15s; animation-duration: 45s; }
        .bg-animation span:nth-child(9) { left: 45%; width: 25px; height: 25px; animation-delay: 2s; animation-duration: 35s; }
        .bg-animation span:nth-child(10) { left: 90%; width: 70px; height: 70px; animation-delay: 0s; animation-duration: 20s; }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.5;
            }
            100% {
                transform: translateY(-1500px) rotate(720deg);
                opacity: 0;
            }
        }

        /* 글로우 오브 */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orbFloat 8s ease-in-out infinite;
            z-index: 0;
            transition: background 0.5s ease;
        }

        .glow-orb.orb1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            top: -100px;
            right: -100px;
        }

        .glow-orb.orb2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #a55eea, #8854d0);
            bottom: -50px;
            left: -50px;
            animation-delay: -4s;
        }

        .glow-orb.orb3 {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #00d2d3, #54a0ff);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -2s;
        }

        body.parenting-mode .glow-orb.orb1 {
            background: linear-gradient(135deg, #ff9ff3, #f368e0);
        }

        body.parenting-mode .glow-orb.orb2 {
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
        }

        body.parenting-mode .glow-orb.orb3 {
            background: linear-gradient(135deg, #ff9ff3, #a55eea);
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .container {
            text-align: center;
            padding: 40px;
            position: relative;
            z-index: 10;
        }

        .current-time {
            position: fixed;
            top: 30px;
            right: 30px;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        /* 탭 스타일 */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .tab-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: #fff;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
        }

        .tab-btn.active.parenting {
            background: linear-gradient(135deg, #ff9ff3, #f368e0);
            box-shadow: 0 10px 30px rgba(255, 159, 243, 0.3);
        }

        .emoji {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 107, 107, 0.5));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #a0a0ff 50%, #ff9ff3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.3);
        }

        .title.parenting {
            background: linear-gradient(135deg, #fff 0%, #ff9ff3 50%, #ffeaa7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 3px;
        }

        .timer-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 50px;
        }

        .time-block {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 35px 30px;
            min-width: 140px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .time-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        }

        .time-block:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .time-value {
            font-size: 5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #ff9ff3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            animation: glow 3s ease-in-out infinite;
        }

        .time-value.parenting {
            background: linear-gradient(135deg, #ff9ff3 0%, #f368e0 50%, #ffeaa7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.5)); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 159, 243, 0.8)); }
        }

        .time-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 600;
        }

        .colon {
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.3);
            align-self: center;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .progress-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto 40px;
        }

        .progress-bar {
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #ff9ff3, #54a0ff);
            background-size: 300% 100%;
            border-radius: 20px;
            transition: width 1s ease;
            animation: shimmer 3s ease-in-out infinite;
            position: relative;
        }

        .progress-fill.parenting {
            background: linear-gradient(90deg, #ff9ff3, #f368e0, #ffeaa7, #fdcb6e);
            background-size: 300% 100%;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shine 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            font-weight: 300;
        }

        .message {
            font-size: 1.6rem;
            margin-top: 30px;
            padding: 25px 40px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: inline-block;
            font-weight: 300;
        }

        .message.working {
            color: #feca57;
        }

        .message.done {
            color: #5cd85c;
            animation: celebrate 0.5s ease-in-out infinite alternate;
        }

        .message.before-work {
            color: #54a0ff;
        }

        .message.parenting {
            color: #ff9ff3;
        }

        @keyframes celebrate {
            from { transform: scale(1) rotate(-1deg); }
            to { transform: scale(1.02) rotate(1deg); }
        }

        /* 컨페티 효과 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 1000;
            animation: confettiFall 3s ease-in-out forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* 축하 화면 */
        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(92, 216, 92, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .celebration-overlay.active {
            opacity: 1;
        }

        .celebration-overlay.parenting {
            background: radial-gradient(ellipse at center, rgba(255, 159, 243, 0.15) 0%, transparent 70%);
        }

        .footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
        }

        .footer a:hover {
            color: #ff9ff3;
            background: rgba(255, 255, 255, 0.1);
        }

        .footer p {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            font-weight: 300;
        }

        @media (max-width: 768px) {
            .tab-container {
                flex-direction: column;
                align-items: center;
            }

            .tab-btn {
                width: 200px;
            }

            .timer-container {
                flex-wrap: wrap;
                gap: 15px;
            }

            .time-block {
                min-width: 100px;
                padding: 25px 20px;
            }

            .time-value {
                font-size: 3.5rem;
            }

            .title {
                font-size: 2.2rem;
            }

            .colon {
                display: none;
            }

            .emoji {
                font-size: 4rem;
            }

            .current-time {
                top: 15px;
                right: 15px;
                font-size: 0.9rem;
                padding: 10px 15px;
            }

            .message {
                font-size: 1.2rem;
                padding: 20px 25px;
            }
        }
    </style>
</head>
<body>
    <!-- 배경 애니메이션 -->
    <div class="bg-animation">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- 글로우 오브 -->
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>
    <div class="glow-orb orb3"></div>

    <!-- 축하 오버레이 -->
    <div class="celebration-overlay" id="celebrationOverlay"></div>

    <div class="current-time" id="currentTime"></div>

    <div class="container">
        <!-- 탭 버튼 -->
        <div class="tab-container">
            <button class="tab-btn active" id="workTab" onclick="switchTab('work')">
                💼 퇴근 카운트다운
            </button>
            <button class="tab-btn" id="parentingTab" onclick="switchTab('parenting')">
                👶 육아 출근
            </button>
        </div>

        <div class="emoji" id="emoji">💼</div>
        <h1 class="title" id="title">퇴근 카운트다운</h1>
        <p class="subtitle" id="subtitle">TARGET : 18:00</p>

        <div class="timer-container">
            <div class="time-block">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <span class="colon">:</span>
            <div class="time-block">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <span class="colon">:</span>
            <div class="time-block">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">오늘 하루 0% 완료</p>
        </div>

        <div class="message" id="message"></div>

        <footer class="footer">
            <a href="https://blog.naver.com/biodad" target="_blank" rel="noopener noreferrer">blog.naver.com/biodad</a>
            <p>&copy; 2026 biodad. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // 설정
        const WORK_START_HOUR = 9;
        const WORK_END_HOUR = 18;
        const PARENTING_START_HOUR = 18;
        const PARENTING_END_HOUR = 21; // 아이 취침 시간

        let confettiInterval = null;
        let isWorkDone = false;
        let isParentingDone = false;
        let currentTab = 'work';

        // 육아 응원 메시지
        const parentingMessages = {
            early: [
                '육아 출근! 오늘도 사랑으로 시작해요 💕',
                '퇴근했지만 진짜 일이 시작됐죠? 파이팅! 💪',
                '아이와 함께하는 소중한 시간이에요 🌟',
                '세상에서 가장 중요한 일, 육아 시작! 👨‍👩‍👧'
            ],
            middle: [
                '밥 먹이고, 씻기고... 대단해요! 🍚🛁',
                '힘들어도 아이 웃음에 힐링되죠? 😊',
                '당신은 최고의 부모예요! 🏆',
                '오늘 하루도 정말 고생 많아요 💝',
                '잠시 숨 고르기! 당신도 소중해요 ☕'
            ],
            almost: [
                '조금만 더! 취침 시간이 다가와요 🌙',
                '오늘 하루 정말 수고했어요! 💫',
                '곧 나만의 시간이 올 거예요! ✨',
                '마지막 힘내기! 거의 다 왔어요! 🎯'
            ],
            done: [
                '육아 퇴근! 오늘도 완벽했어요! 🎉',
                '드디어 나만의 시간! 푹 쉬세요 💆',
                '최고의 부모상 드립니다! 🏅',
                '아이도 당신도 오늘 수고했어요 💕'
            ],
            waiting: [
                '아직 퇴근 전이에요! 조금만 기다려요 ⏰',
                '회사 일 먼저 끝내고 오세요~ 💼',
                '육아 출근은 18시부터! 🕕'
            ]
        };

        function getRandomMessage(messages) {
            return messages[Math.floor(Math.random() * messages.length)];
        }

        function createConfetti() {
            const colors = currentTab === 'work'
                ? ['#ff6b6b', '#feca57', '#ff9ff3', '#54a0ff', '#5cd85c', '#a55eea']
                : ['#ff9ff3', '#f368e0', '#ffeaa7', '#fdcb6e', '#fab1a0', '#fd79a8'];
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            confetti.style.width = (Math.random() * 10 + 5) + 'px';
            confetti.style.height = confetti.style.width;
            confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(confetti);

            setTimeout(() => confetti.remove(), 3000);
        }

        function startCelebration() {
            if (confettiInterval) return;
            const overlay = document.getElementById('celebrationOverlay');
            overlay.classList.add('active');
            if (currentTab === 'parenting') overlay.classList.add('parenting');
            confettiInterval = setInterval(createConfetti, 100);
            setTimeout(() => {
                clearInterval(confettiInterval);
                confettiInterval = setInterval(createConfetti, 500);
            }, 3000);
        }

        function stopCelebration() {
            if (confettiInterval) {
                clearInterval(confettiInterval);
                confettiInterval = null;
            }
            const overlay = document.getElementById('celebrationOverlay');
            overlay.classList.remove('active');
            overlay.classList.remove('parenting');
        }

        function switchTab(tab) {
            currentTab = tab;
            const workBtn = document.getElementById('workTab');
            const parentingBtn = document.getElementById('parentingTab');
            const title = document.getElementById('title');
            const subtitle = document.getElementById('subtitle');
            const timeValues = document.querySelectorAll('.time-value');
            const progressFill = document.getElementById('progressFill');

            stopCelebration();
            isWorkDone = false;
            isParentingDone = false;

            if (tab === 'work') {
                document.body.classList.remove('parenting-mode');
                workBtn.classList.add('active');
                workBtn.classList.remove('parenting');
                parentingBtn.classList.remove('active');
                parentingBtn.classList.remove('parenting');
                title.classList.remove('parenting');
                timeValues.forEach(el => el.classList.remove('parenting'));
                progressFill.classList.remove('parenting');
            } else {
                document.body.classList.add('parenting-mode');
                parentingBtn.classList.add('active', 'parenting');
                workBtn.classList.remove('active');
                title.classList.add('parenting');
                timeValues.forEach(el => el.classList.add('parenting'));
                progressFill.classList.add('parenting');
            }

            updateTimer();
        }

        function updateWorkTimer(now) {
            const title = document.getElementById('title');
            const subtitle = document.getElementById('subtitle');
            const emoji = document.getElementById('emoji');
            const message = document.getElementById('message');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');

            title.textContent = '퇴근 카운트다운';
            subtitle.textContent = 'TARGET : 18:00';

            const endTime = new Date(now);
            endTime.setHours(WORK_END_HOUR, 0, 0, 0);

            const startTime = new Date(now);
            startTime.setHours(WORK_START_HOUR, 0, 0, 0);

            const diff = endTime - now;

            if (diff <= 0) {
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';

                emoji.textContent = '🎉';
                message.className = 'message done';
                message.innerHTML = '퇴근 완료! 오늘도 정말 수고하셨습니다! 🚀✨';

                progressFill.style.width = '100%';
                progressText.textContent = '🎊 오늘 하루 100% 완료! 내일 또 만나요~ 🎊';

                if (!isWorkDone) {
                    isWorkDone = true;
                    startCelebration();
                }
                return;
            }

            isWorkDone = false;
            stopCelebration();

            if (now < startTime) {
                const beforeWork = startTime - now;
                const bHours = Math.floor(beforeWork / (1000 * 60 * 60));
                const bMinutes = Math.floor((beforeWork % (1000 * 60 * 60)) / (1000 * 60));
                const bSeconds = Math.floor((beforeWork % (1000 * 60)) / 1000);

                document.getElementById('hours').textContent = String(bHours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(bMinutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(bSeconds).padStart(2, '0');

                emoji.textContent = '😴';
                message.className = 'message before-work';
                message.innerHTML = '아직 꿈나라... 조금만 더 자도 돼요 💤🌙';

                progressFill.style.width = '0%';
                progressText.textContent = '☀️ 출근까지 시간이 남았어요';
                return;
            }

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            const totalWorkTime = endTime - startTime;
            const elapsedTime = now - startTime;
            const progress = Math.min(100, Math.max(0, (elapsedTime / totalWorkTime) * 100));

            progressFill.style.width = progress.toFixed(1) + '%';
            progressText.textContent = `⏱️ 오늘 하루 ${progress.toFixed(1)}% 완료`;

            if (hours === 0 && minutes < 10) {
                emoji.textContent = '🏃‍♂️';
                message.className = 'message working';
                message.innerHTML = '10분 남았어요! 짐 싸세요! 🎒💨';
            } else if (hours === 0 && minutes < 30) {
                emoji.textContent = '🔥';
                message.className = 'message working';
                message.innerHTML = '거의 다 왔어요! 마지막 스퍼트! 🏁✨';
            } else if (hours === 0) {
                emoji.textContent = '⚡';
                message.className = 'message working';
                message.innerHTML = '1시간도 안 남았어요! 화이팅! 💪🔥';
            } else if (hours < 2) {
                emoji.textContent = '☕';
                message.className = 'message working';
                message.innerHTML = '오후도 파이팅! 달콤한 간식 어때요? 🍰';
            } else if (hours < 4) {
                emoji.textContent = '💻';
                message.className = 'message working';
                message.innerHTML = '열심히 일하는 중... 퇴근이 기다려요! 🌅';
            } else {
                emoji.textContent = '💼';
                message.className = 'message working';
                message.innerHTML = '오늘도 화이팅! 천천히 가도 괜찮아요 🌤️';
            }
        }

        function updateParentingTimer(now) {
            const title = document.getElementById('title');
            const subtitle = document.getElementById('subtitle');
            const emoji = document.getElementById('emoji');
            const message = document.getElementById('message');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');

            title.textContent = '육아 출근';
            subtitle.textContent = 'TARGET : 21:00 (취침 시간)';

            const startTime = new Date(now);
            startTime.setHours(PARENTING_START_HOUR, 0, 0, 0);

            const endTime = new Date(now);
            endTime.setHours(PARENTING_END_HOUR, 0, 0, 0);

            // 육아 시작 전 (18시 이전)
            if (now < startTime) {
                const beforeParenting = startTime - now;
                const bHours = Math.floor(beforeParenting / (1000 * 60 * 60));
                const bMinutes = Math.floor((beforeParenting % (1000 * 60 * 60)) / (1000 * 60));
                const bSeconds = Math.floor((beforeParenting % (1000 * 60)) / 1000);

                document.getElementById('hours').textContent = String(bHours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(bMinutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(bSeconds).padStart(2, '0');

                emoji.textContent = '💼';
                message.className = 'message before-work';
                message.innerHTML = getRandomMessage(parentingMessages.waiting);

                progressFill.style.width = '0%';
                progressText.textContent = '🕕 육아 출근까지 남은 시간';

                isParentingDone = false;
                stopCelebration();
                return;
            }

            const diff = endTime - now;

            // 육아 끝 (21시 이후)
            if (diff <= 0) {
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';

                emoji.textContent = '🌙';
                message.className = 'message done';
                message.innerHTML = getRandomMessage(parentingMessages.done);

                progressFill.style.width = '100%';
                progressText.textContent = '🎊 육아 퇴근! 이제 나만의 시간~ 🎊';

                if (!isParentingDone) {
                    isParentingDone = true;
                    startCelebration();
                }
                return;
            }

            isParentingDone = false;
            stopCelebration();

            // 육아 중
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            const totalParentingTime = endTime - startTime;
            const elapsedTime = now - startTime;
            const progress = Math.min(100, Math.max(0, (elapsedTime / totalParentingTime) * 100));

            progressFill.style.width = progress.toFixed(1) + '%';
            progressText.textContent = `👶 육아 ${progress.toFixed(1)}% 완료`;

            if (hours === 0 && minutes < 30) {
                emoji.textContent = '🌙';
                message.className = 'message parenting';
                message.innerHTML = getRandomMessage(parentingMessages.almost);
            } else if (hours < 1) {
                emoji.textContent = '🛁';
                message.className = 'message parenting';
                message.innerHTML = getRandomMessage(parentingMessages.middle);
            } else {
                emoji.textContent = '👶';
                message.className = 'message parenting';
                message.innerHTML = getRandomMessage(parentingMessages.early);
            }
        }

        function updateTimer() {
            const now = new Date();

            document.getElementById('currentTime').textContent =
                now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            if (currentTab === 'work') {
                updateWorkTimer(now);
            } else {
                updateParentingTimer(now);
            }
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
